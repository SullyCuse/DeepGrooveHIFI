[build]
  # Domain retired — no Hugo build. `static/` is published verbatim so the
  # only thing this site does is serve `_redirects`. An explicit empty command
  # also stops Netlify's framework auto-detection from re-running Hugo.
  command   = ""
  publish   = "static"

# Domain retirement: all 301s to audiochainhifi.com live in static/_redirects
# (published as the site root). Kept in one file to avoid netlify.toml vs
# _redirects processing-order ambiguity.
