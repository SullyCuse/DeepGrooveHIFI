[build]
  command   = "hugo --minify"
  publish   = "public"

[build.environment]
  HUGO_VERSION = "0.128.0"

# Domain retirement: all 301s to audiochainhifi.com live in static/_redirects
# (copied to the site root at build). Kept in one file to avoid netlify.toml vs
# _redirects processing-order ambiguity.

[context.production.environment]
  HUGO_ENV = "production"
